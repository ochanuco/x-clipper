name: Build Release Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production package
        run: pnpm run build:prod
      - name: Create zip archive
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          ZIP_NAME="x-clipper-v${VERSION}.zip"
          (cd dist && zip -r "../${ZIP_NAME}" .)
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
        id: archive
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('x-clipper-dist-{0}', github.sha) }}
          path: dist/
          retention-days: 30
      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.zip_name }}
          path: ${{ steps.archive.outputs.zip_name }}
          retention-days: 30
